services:
  postgres:
    image: postgres:16-alpine
    container_name: ipos-postgres
    restart: unless-stopped
    ports:
      - "5437:5432"
    environment:
      POSTGRES_DB: ipos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${IPOS_DB_PASSWORD:-postgres}
    volumes:
      - ipos_pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ipos"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: ipos-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  ipos_pgdata:
