<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/sidebar :: html(#{nav.locations}, ~{::content})}">
<head><title>Storage location form - iPOS</title></head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <div>
            <div class="eyebrow"><a href="/stock/locations" class="subtle-link">Storage locations</a> / <span th:text="${editing ? 'Edit' : 'New'}">New</span></div>
            <h1 th:text="${editing ? 'Edit storage location' : 'New storage location'}">New storage location</h1>
            <div class="subtitle">Give the place a short code that staff can write on labels and shelf edges.</div>
        </div>
        <div class="page-actions">
            <a href="/stock/locations" class="btn btn-outline">Cancel</a>
        </div>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="${editing} ? @{/stock/locations/{id}(id=${locationForm.id})} : @{/stock/locations}"
          th:object="${locationForm}" method="post" class="form-layout">
        <div class="section">
            <div class="section-header"><h2>Location details</h2></div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="code">Code *</label>
                    <input id="code" th:field="*{code}" required maxlength="40" placeholder="RACK-A1" class="mono">
                    <div class="hint">A short, unique label such as RACK-A1 or DRAWER-03.</div>
                    <div class="field-error" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                </div>
                <div class="form-group">
                    <label for="type">Type *</label>
                    <select id="type" th:field="*{type}" required>
                        <option th:each="type : ${types}" th:value="${type}" th:text="${type.label()}"></option>
                    </select>
                    <div class="field-error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
                </div>
                <div class="form-group full-width">
                    <label for="name">Name *</label>
                    <input id="name" th:field="*{name}" required maxlength="120" placeholder="Rack A, shelf 1">
                    <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                <div class="form-group full-width">
                    <label for="description">Description</label>
                    <input id="description" th:field="*{description}" maxlength="255" placeholder="Near the back door, second row">
                    <div class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                </div>
                <div class="form-group full-width" data-color-field>
                    <label for="colorAccent">Color accent</label>
                    <div class="color-control">
                        <input type="color" id="colorAccentPicker" value="#268071" data-color-picker aria-label="Choose color accent">
                        <input id="colorAccent" th:field="*{colorAccent}" maxlength="7" placeholder="#268071" class="mono" data-color-text>
                        <button type="button" class="btn btn-outline btn-sm" data-color-clear>Clear</button>
                    </div>
                    <div class="color-presets">
                        <button type="button" class="color-preset" style="--swatch:#268071" data-color-preset="#268071" title="Teal" aria-label="Teal"></button>
                        <button type="button" class="color-preset" style="--swatch:#059669" data-color-preset="#059669" title="Emerald" aria-label="Emerald"></button>
                        <button type="button" class="color-preset" style="--swatch:#2563eb" data-color-preset="#2563eb" title="Blue" aria-label="Blue"></button>
                        <button type="button" class="color-preset" style="--swatch:#4f46e5" data-color-preset="#4f46e5" title="Indigo" aria-label="Indigo"></button>
                        <button type="button" class="color-preset" style="--swatch:#d97706" data-color-preset="#d97706" title="Amber" aria-label="Amber"></button>
                        <button type="button" class="color-preset" style="--swatch:#e11d48" data-color-preset="#e11d48" title="Rose" aria-label="Rose"></button>
                        <button type="button" class="color-preset" style="--swatch:#475569" data-color-preset="#475569" title="Slate" aria-label="Slate"></button>
                    </div>
                    <div class="hint">Optional. Used for the location badge on POS product cards.</div>
                    <div class="field-error" th:if="${#fields.hasErrors('colorAccent')}" th:errors="*{colorAccent}"></div>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <label class="checkbox-row"><input type="checkbox" th:field="*{active}"> Active and available for mapping</label>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" th:text="${editing ? 'Save changes' : 'Create location'}">Create location</button>
                <a href="/stock/locations" class="btn btn-outline">Cancel</a>
            </div>
        </div>
    </form>
</div>
</body>
</html>
