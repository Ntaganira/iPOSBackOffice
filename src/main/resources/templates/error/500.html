<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/sidebar :: html(#{error.500.title}, ~{::content})}">
<head><title th:text="#{error.500.title}">Something went wrong - iPOS</title></head>
<body>
<div th:fragment="content" class="error-page">
    <section class="error-card is-500">
        <div class="error-visual">
            <span class="error-ghost" aria-hidden="true">500</span>
            <span class="error-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                    <line x1="12" y1="9" x2="12" y2="13"></line>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
            </span>
        </div>
        <h1 th:text="#{error.500.title}">Something went wrong</h1>
        <p th:text="#{error.500.subtitle}">The request could not be completed. Try again or check the server log.</p>
        <div class="error-actions">
            <a href="/dashboard" class="btn btn-primary" th:text="#{common.backToDashboard}">Back to dashboard</a>
            <button type="button" class="btn btn-outline" onclick="history.back()" th:text="#{error.goBack}">Go back</button>
        </div>
    </section>
</div>
</body>
</html>
