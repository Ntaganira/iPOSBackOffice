<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/sidebar :: html(#{error.404.title}, ~{::content})}">
<head><title th:text="#{error.404.title}">Page not found - iPOS</title></head>
<body>
<div th:fragment="content" class="error-page">
    <section class="error-card is-404">
        <div class="error-visual">
            <span class="error-ghost" aria-hidden="true">404</span>
            <span class="error-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                </svg>
            </span>
        </div>
        <h1 th:text="#{error.404.title}">Page not found</h1>
        <p th:text="#{error.404.subtitle}">The page or record you requested does not exist.</p>
        <div class="error-actions">
            <a href="/dashboard" class="btn btn-primary" th:text="#{common.backToDashboard}">Back to dashboard</a>
            <button type="button" class="btn btn-outline" onclick="history.back()" th:text="#{error.goBack}">Go back</button>
        </div>
    </section>
</div>
</body>
</html>
