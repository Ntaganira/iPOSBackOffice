<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{error.404.title}">Not found - iPOS</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="empty-state" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;">
    <div class="icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
    </div>
    <h3 th:text="#{error.404.title}">Page not found</h3>
    <p th:text="#{error.404.subtitle}">The page or record you requested does not exist.</p>
    <a href="/dashboard" class="btn btn-primary" th:text="#{common.backToDashboard}">Back to dashboard</a>
</div>
</body>
</html>
