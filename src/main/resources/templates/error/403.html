<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/sidebar :: html(#{error.403.title}, ~{::content})}">
<head><title th:text="#{error.403.title}">Access denied - iPOS</title></head>
<body>
<div th:fragment="content" class="error-page">
    <section class="error-card is-403">
        <div class="error-visual">
            <span class="error-ghost" aria-hidden="true">403</span>
            <span class="error-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </span>
        </div>
        <h1 th:text="#{error.403.title}">Access denied</h1>
        <p th:text="#{error.403.subtitle}">Your account does not have permission to open this page.</p>
        <div class="error-actions">
            <a href="/dashboard" class="btn btn-primary" th:text="#{common.backToDashboard}">Back to dashboard</a>
            <button type="button" class="btn btn-outline" onclick="history.back()" th:text="#{error.goBack}">Go back</button>
        </div>
    </section>
</div>
</body>
</html>
