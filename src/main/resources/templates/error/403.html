<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{error.403.title}">Access denied - iPOS</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="empty-state" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;">

        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
    </div>
    <h3 th:text="#{error.403.title}">Access denied</h3>

    <a href="/dashboard" class="btn btn-primary" th:text="#{common.backToDashboard}">Back to dashboard</a>
