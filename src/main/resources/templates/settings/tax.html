<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/sidebar :: html(#{nav.settings}, ~{::content})}">
<head><title>Tax settings - iPOS</title></head>
<body>
<div th:fragment="content" class="settings-page">
    <div class="page-header">
        <div>
            <div class="eyebrow">Settings</div>
            <h1>Tax categories</h1>
            <div class="subtitle">VAT rates applied to product prices.</div>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div th:replace="~{settings/tabs :: tabs('tax')}"></div>

    <section class="settings-card">
        <div class="settings-card-head">
            <span class="settings-card-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="5" x2="5" y2="19"></line><circle cx="6.5" cy="6.5" r="2.5"></circle><circle cx="17.5" cy="17.5" r="2.5"></circle></svg>
            </span>
            <div>
                <h2>VAT rates</h2>
                <p>Edit a row and save it on its own. Existing documents keep the rate used when they were created.</p>
            </div>
            <span class="section-count" th:text="${#lists.size(taxCategories)}">0</span>
        </div>
        <div class="table-container tax-table-wrap">
            <table class="tax-table">
                <thead>
                <tr><th>Code</th><th>Name</th><th class="text-right">Rate</th><th class="text-center">Exempt</th><th class="text-center">Active</th><th class="text-right">Action</th></tr>
                </thead>
                <tbody>
                <tr th:each="category : ${taxCategories}">
                    <td>
                        <form th:action="@{/settings/tax}" method="post" class="tax-code-form" th:id="'tax-' + ${category.code}">
                            <input type="hidden" name="code" th:value="${category.code}">
                            <span class="tax-code" th:text="${category.code}">A</span>
                        </form>
                    </td>
                    <td>
                        <input class="tax-input" name="name" th:value="${category.name}" required maxlength="80"
                               th:form="'tax-' + ${category.code}" th:aria-label="'Name for tax category ' + ${category.code}">
                    </td>
                    <td class="text-right">
                        <span class="tax-rate-field">
                            <input name="rate" type="number" step="0.01" min="0" max="100" th:value="${category.rate}"
                                   th:form="'tax-' + ${category.code}" th:aria-label="'Rate for tax category ' + ${category.code}">
                            <span>%</span>
                        </span>
                    </td>
                    <td class="text-center">
                        <span class="switch">
                            <input type="checkbox" name="exempt" value="true" th:checked="${category.exempt}"
                                   th:form="'tax-' + ${category.code}" th:aria-label="'Exempt ' + ${category.code}">
                            <span class="switch-track" aria-hidden="true"></span>
                        </span>
                    </td>
                    <td class="text-center">
                        <span class="switch">
                            <input type="checkbox" name="active" value="true" th:checked="${category.active}"
                                   th:form="'tax-' + ${category.code}" th:aria-label="'Active ' + ${category.code}">
                            <span class="switch-track" aria-hidden="true"></span>
                        </span>
                    </td>
                    <td class="text-right">
                        <button type="submit" class="btn btn-outline btn-sm" th:form="'tax-' + ${category.code}">Save</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <p class="hint tax-hint">Rates are percentages, e.g. 18 means 18% VAT. Prices in iPOS are VAT-inclusive.</p>
    </section>
</div>
</body>
</html>
