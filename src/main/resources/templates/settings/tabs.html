<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="tabs(active)" class="settings-nav" aria-label="Settings sections">
    <a th:href="@{/settings/shop}" class="settings-nav-link" th:classappend="${active == 'shop'} ? 'is-active'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M9 22V12h6v10"></path></svg>
        <span>Shop</span>
    </a>
    <a th:href="@{/settings/email}" class="settings-nav-link" th:classappend="${active == 'email'} ? 'is-active'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><path d="M22 6l-10 7L2 6"></path></svg>
        <span>Email</span>
    </a>
    <a th:href="@{/settings/tax}" class="settings-nav-link" th:classappend="${active == 'tax'} ? 'is-active'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="5" x2="5" y2="19"></line><circle cx="6.5" cy="6.5" r="2.5"></circle><circle cx="17.5" cy="17.5" r="2.5"></circle></svg>
        <span>Tax</span>
    </a>
</nav>
</body>
</html>
