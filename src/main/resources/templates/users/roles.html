<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/sidebar :: html(#{nav.users}, ~{::content})}">
<head><title>Roles - iPOS</title></head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <div>
            <div class="eyebrow"><a href="/users" class="subtle-link">Users</a> / Roles</div>
            <h1>Role permissions</h1>
            <div class="subtitle">What each system role is allowed to do.</div>
        </div>
        <div class="page-actions"><a href="/users" class="btn btn-outline">Back to users</a></div>
    </div>

    <div class="summary-grid">
        <div class="summary-card" th:each="role : ${roles}">
            <div class="value" th:text="${#lists.size(rolePermissions[role.code])}">0</div>
            <div class="label" th:text="${role.name}">Administrator</div>
        </div>
    </div>

    <div class="section">
        <div class="section-header"><h2>Permission matrix</h2></div>
        <div class="table-container table-flush role-matrix">
            <table>
                <thead>
                <tr>
                    <th>Permission</th>
                    <th class="text-center" th:each="role : ${roles}" th:text="${role.code}">ADMIN</th>
                </tr>
                </thead>
                <tbody th:each="category : ${permissionsByCategory}">
                <tr class="matrix-category"><td th:colspan="${#lists.size(roles) + 1}" th:text="${category.key}">Category</td></tr>
                <tr th:each="permission : ${category.value}">
                    <td><strong th:text="${permission.name}">Name</strong><div class="muted mono" th:text="${permission.code}">CODE</div></td>
                    <td class="text-center" th:each="role : ${roles}">
                        <span th:if="${#lists.contains(rolePermissions[role.code], permission.code)}" class="permission-yes">✓</span>
                        <span th:if="${!#lists.contains(rolePermissions[role.code], permission.code)}" class="permission-no">—</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <p class="hint">Administrators always have every permission. Roles are defined by the system and cannot be renamed.</p>
    </div>
</div>
</body>
</html>
