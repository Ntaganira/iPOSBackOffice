<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/sidebar :: html(#{nav.products}, ~{::content})}">
<head><title>Product form - iPOS</title></head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <div>
            <div class="eyebrow"><a href="/products" class="subtle-link">Products</a> / <span th:text="${editing ? 'Edit' : 'New'}">New</span></div>
            <h1 th:text="${editing ? 'Edit product' : 'New product'}">New product</h1>
            <div class="subtitle">Prices are entered inclusive of VAT, as sold at the counter.</div>
        </div>
        <div class="page-actions">
            <a href="/products" class="btn btn-outline">Cancel</a>
        </div>
    </div>

    <form th:action="${editing} ? @{/products/{id}(id=${productForm.id})} : @{/products}" th:object="${productForm}" method="post"
          enctype="multipart/form-data" class="form-layout">
        <div class="section">
            <div class="section-header"><h2>Identity</h2></div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="code">Product code *</label>
                    <input id="code" th:field="*{code}" required maxlength="40" placeholder="SKU-001">
                    <div class="field-error" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                </div>
                <div class="form-group">
                    <label for="barcode">Barcode</label>
                    <input id="barcode" th:field="*{barcode}" maxlength="60" placeholder="Optional">
                </div>
                <div class="form-group full-width">
                    <label for="name">Name *</label>
                    <input id="name" th:field="*{name}" required maxlength="160" placeholder="Product name">
                    <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                <div class="form-group">
                    <label for="categoryId">Category *</label>
                    <select id="categoryId" th:field="*{categoryId}" required>
                        <option value="">Choose a category</option>
                        <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
                    </select>
                    <div class="field-error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
                </div>
                <div class="form-group">
                    <label for="unitId">Unit *</label>
                    <select id="unitId" th:field="*{unitId}" required>
                        <option value="">Choose a unit</option>
                        <option th:each="unit : ${units}" th:value="${unit.id}" th:text="${unit.name + ' (' + unit.code + ')'}"></option>
                    </select>
                    <div class="field-error" th:if="${#fields.hasErrors('unitId')}" th:errors="*{unitId}"></div>
                </div>
                <div class="form-group">
                    <label for="taxCategoryCode">Tax category *</label>
                    <select id="taxCategoryCode" th:field="*{taxCategoryCode}" required>
                        <option th:each="tax : ${taxCategories}" th:value="${tax.code}" th:text="${tax.label() + (tax.exempt ? ' (exempt)' : ' (' + tax.rate + '%)')}"></option>
                    </select>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-header"><h2>Pricing &amp; stock</h2></div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="buyingPrice">Buying price *</label>
                    <input id="buyingPrice" th:field="*{buyingPrice}" type="number" min="0" step="0.01" required>
                    <div class="field-error" th:if="${#fields.hasErrors('buyingPrice')}" th:errors="*{buyingPrice}"></div>
                </div>
                <div class="form-group">
                    <label for="sellingPrice">Selling price *</label>
                    <input id="sellingPrice" th:field="*{sellingPrice}" type="number" min="0" step="0.01" required>
                    <div class="field-error" th:if="${#fields.hasErrors('sellingPrice')}" th:errors="*{sellingPrice}"></div>
                </div>
                <div class="form-group">
                    <label for="reorderLevel">Reorder level *</label>
                    <input id="reorderLevel" th:field="*{reorderLevel}" type="number" min="0" step="0.001" required>
                </div>
                <div class="form-group">
                    <label for="locationId">Storage location</label>
                    <select id="locationId" th:field="*{locationId}">
                        <option value="">Not assigned</option>
                        <option th:each="location : ${locations}" th:value="${location.id}"
                                th:text="${location.label() + (location.active ? '' : ' (inactive)')}"></option>
                    </select>
                    <div class="hint">Rack, drawer or room where the item is kept.</div>
                </div>
                <div class="form-group" th:if="${!editing}">
                    <label for="openingQuantity">Opening stock</label>
                    <input id="openingQuantity" th:field="*{openingQuantity}" type="number" min="0" step="0.001">
                    <div class="hint">Recorded as an opening stock movement.</div>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <label class="checkbox-row"><input type="checkbox" th:field="*{active}"> Active and sellable</label>
                </div>
                <div class="form-group">
                    <label for="image">Product image</label>
                    <input id="image" name="image" type="file" accept="image/*">
                    <div class="hint" th:if="${editing and product.imagePath != null}">Leave empty to keep the current image.</div>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" th:text="${editing ? 'Save changes' : 'Create product'}">Create product</button>
                <a href="/products" class="btn btn-outline">Cancel</a>
            </div>
        </div>
    </form>
</div>
</body>
</html>
