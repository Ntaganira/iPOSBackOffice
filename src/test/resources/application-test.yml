spring:
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
  thymeleaf:
    cache: false

app:
  zone: Africa/Kigali
  demo:
    enabled: true
  storage:
    uploads: ${java.io.tmpdir}/ipos-test-uploads
  admin:
    username: admin
    password: admin123
    full-name: Administrator
    email: admin@example.com
  super-admin:
    username: superadmin
    password: superadmin123
    full-name: Platform Administrator
    email: superadmin@ipos.local
  encryption:
    key: test-encryption-key-long-enough
  security:
    remember-me-key: test-remember-me-key
  sync:
    token: test-sync-token
  product-extraction:
    max-image-bytes: 5242880
    tesseract-data-path: ""
    tesseract-languages: eng

logging:
  level:
    org.flywaydb: WARN
    org.hibernate.SQL: WARN
